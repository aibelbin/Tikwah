server {
    # Both families are declared explicitly so the image's
    # 10-listen-on-ipv6-by-default entrypoint script has nothing to rewrite,
    # which it could not do anyway on a read-only root filesystem.
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # SvelteKit emits content-hashed filenames here, so they never change in place.
    location /_app/immutable/ {
        # Single header only: nginx's `expires` directive would emit a second,
        # competing Cache-Control line alongside this one.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA shell must not be cached, or a redeploy would not be picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # adapter-static is configured with fallback: 'index.html', so any path that
    # is not a real file is handed to the client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
